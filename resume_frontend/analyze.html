<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume | ResumeIQ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Resume<span class="accent-text">IQ</span></a>
        <div class="nav-links">
            <a href="history.html" class="nav-link">History</a>
        </div>
    </nav>

    <main class="upload-container">
        <div class="upload-card">
            <h2>Let's analyze your resume</h2>
            <p class="subtitle">Upload your PDF and tell us your target role.</p>

            <form id="uploadForm">
                <div class="input-group">
                    <label for="jobRole">Target Job Role</label>
                    <input type="text" id="jobRole" placeholder="e.g. Software Engineer, Backend Developer" required>
                </div>

                <div class="drop-zone" id="dropZone">
                    <div class="icon">📄</div>
                    <span class="drop-text">Drag & drop your PDF here</span>
                    <span class="or-text">or</span>
                    <input type="file" id="fileInput" accept="application/pdf" hidden>
                    <button type="button" class="btn-outline" id="browseBtn">Browse Files</button>
                    <div id="fileNameDisplay" class="file-name-display"></div>
                </div>

                <div id="errorMessage" class="error-message"></div>

                <button type="submit" class="btn-primary btn-full" id="analyzeBtn" disabled>
                    Analyze My Resume &rarr;
                </button>
            </form>
        </div>
    </main>

    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <h3>🤖 AI is analyzing your resume...</h3>
        <p>This usually takes about 10-15 seconds.</p>
    </div>

    <script src="analyze.js"></script>
</body>
</html>
