<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results | ResumeIQ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Resume<span class="accent-text">IQ</span></a>
        <a href="analyze.html" class="btn-outline">Analyze Another Resume</a>
    </nav>

    <main class="dashboard-container">
        <section class="score-section">
            <div class="chart-container">
                <canvas id="scoreChart"></canvas>
                <div class="score-center">
                    <h2 id="atsScoreDisplay">0</h2>
                    <span>ATS Score</span>
                </div>
            </div>
            <div class="score-details">
                <h3>Keyword Match: <span id="keywordMatchDisplay" class="accent-text">0%</span></h3>
                <p id="cacheBadge" class="badge hidden" style="margin-top: 10px;">⚡ Instant Cache Hit</p>
            </div>
        </section>

        <section class="skills-section">
            <div class="skills-card success-card">
                <h3>✓ Skills Detected</h3>
                <div class="pill-container" id="skillsFoundContainer">
                    </div>
            </div>
            
            <div class="skills-card danger-card">
                <h3>✗ Missing Keywords</h3>
                <div class="pill-container" id="skillsMissingContainer">
                    </div>
            </div>
        </section>

        <section class="exotic-section">
            <div class="feature-panel">
                <h3>💡 High-Level Suggestions</h3>
                <ul id="suggestionsList" class="custom-list"></ul>
            </div>

            <div class="feature-panel">
                <h3>✨ AI Line Rewriter</h3>
                <div id="rewritesContainer"></div>
            </div>

            <div class="feature-panel">
                <h3>🎯 Keyword Sneak Strategy</h3>
                <div id="strategyContainer"></div>
            </div>
        </section>
    </main>

    <script src="results.js"></script>
</body>
</html>
